spring:
  application:
    name: enterprise-ticket-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/enterprise_ticket_system}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

logging:
  level:
    org.springframework.security: INFO
    com.example.ticketing: DEBUG

jwt:
  secret: ${JWT_SECRET:default-insecure-jwt-secret-change-me-please-32chars}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000} # 1 hour
