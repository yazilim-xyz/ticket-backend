spring.application.name=enterprise-ticket-system

spring.datasource.url=${DB_URL:jdbc:h2:mem:enterprise_ticket_system;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}


spring.jpa.hibernate.ddl-auto=${JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT SETTINGS (load from env/secret store; DO NOT COMMIT real keys)
jwt.secret=${JWT_SECRET:default-insecure-jwt-secret-change-me-32chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.issuer=${JWT_ISSUER:enterprise-ticket-system}
jwt.audience=${JWT_AUDIENCE:enterprise-ticket-system-client}
jwt.refresh-days=${JWT_REFRESH_DAYS:30}

# Login protection
auth.login.max-attempts=${AUTH_LOGIN_MAX_ATTEMPTS:5}
auth.login.block-minutes=${AUTH_LOGIN_BLOCK_MINUTES:15}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Debug logging for auth investigations (dev only)
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.com.yazilimxyz=DEBUG
