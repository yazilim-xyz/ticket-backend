spring.datasource.url=jdbc:postgresql://localhost:5433/enterprise_ticket_system
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=false

jwt.secret=test-secret-key-should-be-at-least-32-chars-long
jwt.expiration-ms=3600000
jwt.issuer=enterprise-ticket-system
jwt.audience=enterprise-ticket-system-client

logging.level.root=ERROR
