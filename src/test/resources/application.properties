spring.datasource.url=jdbc:h2:mem:enterprise_ticket_system_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true

jwt.secret=test-secret-key-should-be-at-least-32-chars-long
jwt.expiration-ms=3600000
jwt.issuer=enterprise-ticket-system
jwt.audience=enterprise-ticket-system-client

logging.level.root=ERROR
